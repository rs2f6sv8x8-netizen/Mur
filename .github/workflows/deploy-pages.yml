name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/murdoku-ipad-app-p8j57m]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the app (exclude source EPUB and build tools)
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js data assets icons _site/
      - name: Stamp the service worker cache version with this commit
        run: sed -i "s/__BUILD__/${GITHUB_SHA::12}/" _site/sw.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
